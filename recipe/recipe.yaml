schema_version: 1

context:
  version: 1.2.2

package:
  name: livekit-api
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/l/livekit-api/livekit_api-${{ version }}.tar.gz
    sha256: 689753198dfefe58b007581fcce09e1089b2ad80adb3f9445798e55abdc9a264
  - url: https://raw.githubusercontent.com/livekit/python-sdks/refs/tags/api-v${{ version }}/LICENSE
    sha256: c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4
    file_name: LICENSE

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pyjwt >=2.15.1
    - aiohttp >=3.14.4
    - idna >=3.15
    - multidict >=6.9.1
    - protobuf >=4
    - types-protobuf >=4
    - livekit-protocol >=1.1.27,<2.0.0
tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - '*'
      imports:
        - livekit.api
      pip_check: true

about:
  summary: Python Server API for LiveKit
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/livekit/python-sdks
  repository: https://github.com/livekit/python-sdks/
  documentation: https://docs.livekit.io

extra:
  recipe-maintainers:
    - conda-forge/livekit
